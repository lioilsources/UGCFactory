# iOS -> TestFlight.
#
# Podepisuje se automaticky: xcodebuild si profil vyzada primo z App Store
# Connect pres API klic (-allowProvisioningUpdates). Diky tomu staci jediny
# tajny material - ten klic. Predchozi verze tohohle workflow byla zkopirovana
# z Kiranu a chtela .p12 i .mobileprovision v secrets, pritom mela natvrdo
# cizi bundle id (com.ol1n.kiran) a odkazovala se na ExportOptions.plist,
# ktery v repu neexistoval.
name: TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}

      - name: Build number z poradi behu
        working-directory: app
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          sed -i.bak -E "s/^version: .*/version: ${BASE}+${{ github.run_number }}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Flutter deps
        working-directory: app
        run: flutter pub get

      - name: CocoaPods
        working-directory: app/ios
        run: pod install

      - name: App Store Connect API klic
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          # altool hleda klic i tady
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      - name: Build (bez podpisu)
        working-directory: app
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=CF_CLIENT_ID="${{ secrets.UGC_CF_CLIENT_ID }}" \
            --dart-define=CF_CLIENT_SECRET="${{ secrets.UGC_CF_CLIENT_SECRET }}"

      - name: Archive
        working-directory: app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }}

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.IOS_TEAM_ID }}" app/ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist app/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Nahrat na TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Uklid klicu
        if: always()
        run: rm -rf ~/private_keys ~/.appstoreconnect/private_keys
